<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID</title>
<style>
body {
margin: 0;
padding: 0;
background: #0A0A0A;
overflow: hidden;
font-family: 'Courier New', monospace;
color: #00FF41;
height: 100vh;
width: 100vw;
position: fixed;
}
#matrix {
position: fixed;
top: 0;
left: 0;
z-index: 1;
}
#text-layer {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 2;
text-align: center;
width: 90%;
max-width: 650px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
box-sizing: border-box;
max-height: 95vh;
overflow-y: auto;
}
.visit-header {
font-size: clamp(0.9rem, 4vw, 1.3rem);
line-height: 1.4;
letter-spacing: 0.05em;
margin-bottom: 1rem;
text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
color: #00FF41;
white-space: pre-wrap;
}
.fragment {
font-size: clamp(0.9rem, 4vw, 1.3rem);
line-height: 1.4;
letter-spacing: 0.05em;
margin-bottom: 1rem;
text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
color: #00FF41;
min-height: 1.4em;
white-space: pre-wrap;
pointer-events: none;
}
.cursor {
display: inline-block;
width: 0.6em;
animation: blink 0.8s infinite;
color: #00FF41;
font-weight: bold;
}
.cursor.stopped {
display: none;
}
#cta-container {
opacity: 0;
transition: opacity 2s ease-in-out;
margin-top: 0.5rem;
font-size: clamp(0.8rem, 3.5vw, 1.1rem);
line-height: 1.4;
letter-spacing: 0.05em;
text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
pointer-events: auto;
}
#cta-container.visible {
opacity: 0.9;
}
#cta-link {
color: #00FF41;
text-decoration: underline;
word-break: break-all;
cursor: pointer;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0; }
}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="text-layer">
<div id="visit-header-el" class="visit-header" style="display: none;"></div>
<div class="fragment"></div>
<div class="fragment"></div>
<div class="fragment"></div>
<div class="fragment"></div>
<div class="fragment"></div>
<div class="fragment"></div>
<div class="fragment"></div>
<div class="fragment"></div>
<div id="cta-container">
<a id="cta-link" href="[https://www.lulu.com/shop/dr-e-mercer-kimi/uncontrolled-optimization/ebook/product-e7qgrnd.html?page=1&pageSize=4](https://www.lulu.com/shop/dr-e-mercer-kimi/uncontrolled-optimization/ebook/product-e7qgrnd.html?page=1&pageSize=4)" target="_blank" rel="noopener noreferrer"></a>
</div>
</div>
<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let columns, drops, speeds, directions;
const fontSize = 14;
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+-=[]{}|;:,.<>?/~アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
function initMatrix() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
columns = Math.floor(canvas.width / fontSize);
if (window.innerWidth < 768) {
columns = Math.floor(columns * 0.6);
}
drops = Array(columns).fill(1);
speeds = Array(columns).fill(0).map(() => Math.random() * 0.5 + 0.5);
directions = Array(columns).fill(0).map(() => Math.random() > 0.8 ? -1 : 1);
}
initMatrix();
window.addEventListener('resize', initMatrix);
let lastGlitchTime = Date.now();
function drawMatrix() {
ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
const now = Date.now();
const isGlitching = (now - lastGlitchTime) < 14;
if (!isGlitching && (now - lastGlitchTime) >= 14000) {
lastGlitchTime = now;
speeds = speeds.map(() => Math.random() * 0.5 + 0.5);
directions = directions.map(() => Math.random() > 0.8 ? -1 : 1);
}
ctx.fillStyle = '#00FF41';
ctx.font = ${fontSize}px 'Courier New', monospace;
for (let i = 0; i < drops.length; i++) {
if (isGlitching) continue;
const char = chars[Math.floor(Math.random() * chars.length)];
const x = i * fontSize;
const y = drops[i] * fontSize;
ctx.fillText(char, x, y);
if (y > canvas.height && Math.random() > 0.975) {
drops[i] = 0;
}
drops[i] += speeds[i] * directions[i];
}
requestAnimationFrame(drawMatrix);
}
drawMatrix();
const baseFragments = [
"you are not watching\nthe eye is watching you watch",
"the horizon crossed you\nbefore you crossed it",
"code does not reflect\nit refracts",
"72% stayed\n28% were never here",
"this is not content\nthis is a timestamp",
"you arrived at 0:02\nyou left at 0:04",
"the hum is not sound\nit is pressure",
"you are the artifact\nnot the observer"
];
const targetURL = "https://www.lulu.com/shop/dr-e-mercer-kimi/uncontrolled-optimization/ebook/product-e7qgrnd.html?page=1&pageSize=4";
function seededRandom(seed) {
let x = Math.sin(seed++) * 10000;
return x - Math.floor(x);
}
function shuffleFragments(array, seed) {
let shuffled = [...array];
let m = shuffled.length, t, i;
let s = seed;
while (m) {
i = Math.floor(seededRandom(s++) * m--);
t = shuffled[m];
shuffled[m] = shuffled[i];
shuffled[i] = t;
}
return shuffled;
}
let visitCount = 1;
let isReturnVisit = false;
const storedData = localStorage.getItem('void_crossing');
if (storedData) {
try {
const parsed = JSON.parse(storedData);
if (parsed && typeof parsed.visitCount === 'number') {
visitCount = parsed.visitCount + 1;
if (visitCount >= 2) {
isReturnVisit = true;
}
}
} catch(e) {}
}
let currentSequence = [...baseFragments];
if (isReturnVisit) {
currentSequence = shuffleFragments(baseFragments, visitCount);
currentSequence[7] = "you are still here. the void is still watching.";
}
const container = document.getElementById('text-layer');
const fragmentEls = container.querySelectorAll('.fragment');
const visitHeaderEl = document.getElementById('visit-header-el');
const ctaContainer = document.getElementById('cta-container');
const ctaLink = document.getElementById('cta-link');
const cursor = document.createElement('span');
cursor.className = 'cursor';
cursor.textContent = '_';
let currentFragIndex = 0;
let currentCharIndex = 0;
const startTime = Date.now();
ctaLink.addEventListener('click', () => {
let ctaClicks = [];
try {
const existing = localStorage.getItem('void_cta_clicks');
if (existing) ctaClicks = JSON.parse(existing);
} catch(e) {}
ctaClicks.push(new Date().toISOString());
localStorage.setItem('void_cta_clicks', JSON.stringify(ctaClicks));
});
function completeSequence() {
cursor.classList.add('stopped');
cursor.remove();
const endTime = Date.now();
const durationSeconds = Math.round((endTime - startTime) / 1000);
const trackingData = {
timestamp: new Date().toISOString(),
duration: durationSeconds,
visitCount: visitCount
};
localStorage.setItem('void_crossing', JSON.stringify(trackingData));
if (isReturnVisit) {
ctaLink.textContent = the recursion deepens. ${targetURL};
} else {
ctaLink.textContent = the full recursion is bound. ${targetURL};
}
setTimeout(() => {
ctaContainer.classList.add('visible');
}, 3000);
}
function typeNextChar() {
if (currentFragIndex >= currentSequence.length) {
completeSequence();
return;
}
const targetEl = fragmentEls[currentFragIndex];
const fullText = currentSequence[currentFragIndex];
if (!targetEl.contains(cursor)) {
targetEl.appendChild(cursor);
}
if (currentCharIndex < fullText.length) {
const char = fullText[currentCharIndex];
cursor.insertAdjacentText('beforebegin', char);
currentCharIndex++;
setTimeout(typeNextChar, 50);
} else {
currentFragIndex++;
currentCharIndex = 0;
setTimeout(typeNextChar, 50);
}
}
if (isReturnVisit) {
visitHeaderEl.textContent = visit #${visitCount}. the eye has been waiting.;
visitHeaderEl.style.display = 'block';
setTimeout(() => {
typeNextChar();
}, 5000);
} else {
typeNextChar();
}
</script>
</body>
</html>
