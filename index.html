<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        background: #0A0A0A; 
        overflow: hidden; 
        font-family: 'Courier New', monospace;
        color: #FFFFFF;
        height: 100vh;
        width: 100vw;
        /* PREVENT MOBILE BROWSER CHROME FROM HIDING CONTENT */
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
    }
    canvas { position: fixed; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; }
    
    #text-layer {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        text-align: center;
        pointer-events: none;
        width: 90%;
        max-width: 600px;
        /* ENSURE TEXT STAYS WITHIN VIEWPORT ON ALL DEVICES */
        max-height: 80vh;
        overflow: visible;
    }
    
    .fragment {
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
        font-size: clamp(0.9rem, 4vw, 1.5rem); /* SLIGHTLY SMALLER BASE FOR MOBILE */
        line-height: 1.5;
        letter-spacing: 0.05em;
        margin-bottom: 1.5rem;
        text-shadow: 0 0 10px rgba(0,0,0,0.8); /* IMPROVE READABILITY OVER MATRIX */
    }
    
    /* FIRST FRAGMENT: ALWAYS VISIBLE FROM LOAD */
    #frag-0 { opacity: 0.9 !important; }
    
    #final-line {
        position: fixed;
        bottom: 15%; left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        opacity: 0;
        transition: opacity 3s ease-in-out;
        font-size: clamp(0.8rem, 3vw, 1.2rem);
        letter-spacing: 0.1em;
        white-space: nowrap;
        text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    #final-line.visible { opacity: 1; }

    /* MOBILE-SPECIFIC OVERRIDES */
    @media (max-width: 768px) {
        #text-layer {
            top: 45%; /* SHIFT UP SLIGHTLY TO AVOID BOTTOM NAV BAR */
            width: 95%;
        }
        .fragment {
            font-size: clamp(1rem, 5vw, 1.3rem); /* LARGER RELATIVE SIZE ON MOBILE */
            line-height: 1.4;
            margin-bottom: 1rem;
        }
        #frag-0 {
            margin-top: -2rem; /* COMPENSATE FOR ANY TOP CROPPING */
        }
    }
</style>
