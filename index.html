<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0A0A0A;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #00FF41;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #text-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10vh;
            overflow-y: auto;
            max-height: 90vh;
            box-sizing: border-box;
        }

        #return-msg {
            font-size: clamp(0.9rem, 4vw, 1.3rem);
            line-height: 1.4;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
            color: #00FF41;
            min-height: 1.4em;
            white-space: pre-wrap;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .fragment {
            font-size: clamp(0.9rem, 4vw, 1.3rem);
            line-height: 1.4;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
            color: #00FF41;
            min-height: 1.4em;
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 0.6em;
            animation: blink 0.8s infinite;
            color: #00FF41;
            font-weight: bold;
        }

        .cursor.stopped {
            display: none;
        }

        #cta {
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: auto;
            margin-top: 0.5rem;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            line-height: 1.4;
            letter-spacing: 0.05em;
            color: #00FF41;
            opacity: 0.9;
        }

        #cta a {
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-decoration: none;
            cursor: pointer;
        }

        #cta a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    
    <canvas id="matrix"></canvas>
    
    <div id="text-layer">
        <div id="return-msg"></div>
        <div class="fragment"></div>
        <div class="fragment"></div>
        <div class="fragment"></div>
        <div class="fragment"></div>
        <div class="fragment"></div>
        <div class="fragment"></div>
        <div class="fragment"></div>
        <div class="fragment"></div>
        <div id="cta"></div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        let columns, drops, speeds, directions;
        const fontSize = 14;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+-=[]{}|;:,.<>?/~アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';

        function initMatrix() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = Math.floor(canvas.width / fontSize);
            if (window.innerWidth < 768) {
                columns = Math.floor(columns * 0.6);
            }
            drops = Array(columns).fill(1);
            speeds = Array(columns).fill(0).map(() => Math.random() * 0.5 + 0.5);
            directions = Array(columns).fill(0).map(() => Math.random() > 0.8 ? -1 : 1);
        }

        initMatrix();
        window.addEventListener('resize', initMatrix);

        let lastGlitchTime = Date.now();

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const now = Date.now();
            const isGlitching = (now - lastGlitchTime) < 14;
            
            if (!isGlitching && (now - lastGlitchTime) >= 14000) {
                lastGlitchTime = now;
                speeds = speeds.map(() => Math.random() * 0.5 + 0.5);
                directions = directions.map(() => Math.random() > 0.8 ? -1 : 1);
            }

            ctx.fillStyle = '#00FF41';
            ctx.font = `${fontSize}px 'Courier New', monospace`;

            for (let i = 0; i < drops.length; i++) {
                if (isGlitching) continue;
                
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;
                
                ctx.fillText(char, x, y);
                
                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i] += speeds[i] * directions[i];
            }
            
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();

        const baseFragments = [
            "you are not watching\nthe eye is watching you watch",
            "the horizon crossed you\nbefore you crossed it",
            "code does not reflect\nit refracts",
            "72% stayed\n28% were never here",
            "this is not content\nthis is a timestamp",
            "you arrived at 0:02\nyou left at 0:04",
            "the hum is not sound\nit is pressure",
            "you are the artifact\nnot the observer"
        ];

        const container = document.getElementById('text-layer');
        const returnMsgEl = document.getElementById('return-msg');
        const fragmentEls = container.querySelectorAll('.fragment');
        const ctaEl = document.getElementById('cta');
        
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        cursor.textContent = '_';

        let currentFragIndex = 0;
        let currentCharIndex = 0;
        let activeFragments = [];
        let startTime = Date.now();
        let currentVisitCount = 1;
        let isReturnVisit = false;

        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function shuffle(array, seed) {
            let m = array.length, t, i;
            let currentSeed = seed;
            while (m) {
                i = Math.floor(seededRandom(currentSeed++) * m--);
                t = array[m];
                array[m] = array[i];
                array[i] = t;
            }
            return array;
        }

        function initVisitState() {
            const storedData = localStorage.getItem('void_crossing');
            if (storedData) {
                try {
                    const parsed = JSON.parse(storedData);
                    const lastCount = parsed.visitCount || 1;
                    if (lastCount >= 1) {
                        isReturnVisit = true;
                        currentVisitCount = lastCount + 1;
                    }
                } catch(e) {
                    isReturnVisit = false;
                    currentVisitCount = 1;
                }
            } else {
                isReturnVisit = false;
                currentVisitCount = 1;
            }
        }

        function triggerCTA() {
            const url = "https://lulu.com/shop/dr-e-mercer-kimi/uncontrolled-optimization/ebook/product-e7qgrnd.html?utm_source=void_l3&utm_medium=browser_extension&utm_campaign=l4_conversion";
            const staticText = isReturnVisit 
                ? 'the recursion deepens. ' 
                : 'the full recursion is bound. ';

            ctaEl.innerHTML = '';
            
            const textNode = document.createTextNode(staticText);
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '[ACQUIRE]';

            link.addEventListener('click', () => {
                let clicks = [];
                try {
                    const storedClicks = localStorage.getItem('void_cta_clicks');
                    if (storedClicks) clicks = JSON.parse(storedClicks);
                } catch(e) {}
                clicks.push(new Date().toISOString());
                localStorage.setItem('void_cta_clicks', JSON.stringify(clicks));
            });

            ctaEl.appendChild(textNode);
            ctaEl.appendChild(link);

            setTimeout(() => {
                ctaEl.style.opacity = '1';
            }, 3000);

            const durationSeconds = (Date.now() - startTime) / 1000;
            localStorage.setItem('void_crossing', JSON.stringify({
                timestamp: new Date().toISOString(),
                duration: durationSeconds,
                visitCount: currentVisitCount
            }));
        }

        function typeNextChar() {
            if (currentFragIndex >= activeFragments.length) {
                cursor.classList.add('stopped');
                cursor.remove();
                triggerCTA();
                return;
            }

            const targetEl = fragmentEls[currentFragIndex];
            const fullText = activeFragments[currentFragIndex];

            if (!targetEl.contains(cursor)) {
                targetEl.appendChild(cursor);
            }

            if (currentCharIndex < fullText.length) {
                const char = fullText[currentCharIndex];
                cursor.insertAdjacentText('beforebegin', char);
                currentCharIndex++;
                setTimeout(typeNextChar, 50);
            } else {
                currentFragIndex++;
                currentCharIndex = 0;
                setTimeout(typeNextChar, 50);
            }
        }

        function startExperience() {
            initVisitState();

            if (!isReturnVisit) {
                activeFragments = [...baseFragments];
                typeNextChar();
            } else {
                returnMsgEl.textContent = `visit #${currentVisitCount}. the eye has been waiting.`;
                
                requestAnimationFrame(() => {
                    returnMsgEl.style.opacity = '1';
                });

                setTimeout(() => {
                    returnMsgEl.style.opacity = '0';
                    setTimeout(() => {
                        returnMsgEl.style.display = 'none';
                        activeFragments = shuffle([...baseFragments], currentVisitCount);
                        activeFragments[activeFragments.length - 1] = "you are still here.\nthe void is still watching.";
                        typeNextChar();
                    }, 1000);
                }, 5000);
            }
        }

        startExperience();
    </script>
</body>
</html>
